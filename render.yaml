services:
  - type: web
    name: irish-revenue-qa
    env: python
    plan: free
    buildCommand: |
      set -e
      pip install -r requirements.txt
      python scripts/scrape.py || true
      python scripts/build_index.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SCRAPER_MAX_PAGES_PER_SOURCE
        value: "150"
      - key: SCRAPER_DELAY_SECONDS
        value: "0.5"
